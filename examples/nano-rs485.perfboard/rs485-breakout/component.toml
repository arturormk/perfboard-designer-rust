schema_version = 1
id = "local.rs485-breakout"
definition_version = "1.3.0"
name = "RS-485"
description = "Small MAX485-style transceiver breakout"
origin_x = 0
origin_y = 0
allowed_rotations = [
    "deg0",
    "deg90",
    "deg180",
    "deg270",
]
documentation = ""

[body]
x = 0.0
y = 0.0
width = 47.0
height = 13.0

[[pins]]
id = "gnd"
number = "1"
name = "GND"
x = 1
y = 1
functions = ["power"]

[[pins]]
id = "b"
number = "2"
name = "A"
x = 1
y = 2
functions = ["rs485_bus"]

[[pins]]
id = "a"
number = "3"
name = "B"
x = 1
y = 3
functions = ["rs485_bus"]

[[pins]]
id = "vcc"
number = "4"
name = "VCC"
x = 1
y = 4
functions = ["ground"]

[[pins]]
id = "di"
number = "5"
name = "DI"
x = 18
y = 1
functions = ["driver_input"]

[[pins]]
id = "de"
number = "6"
name = "DE"
x = 18
y = 2
functions = ["driver_enable"]

[[pins]]
id = "re"
number = "7"
name = "RE̅"
x = 18
y = 3
functions = ["receiver_enable_active_low"]

[[pins]]
id = "ro"
number = "8"
name = "RO"
x = 18
y = 4
functions = ["receiver_output"]

[[keepouts]]
label = "Breakout body"

[keepouts.min]
x = 1
y = 1

[keepouts.max]
x = 18
y = 4

[[wire_keepouts]]
label = "Left Dupont header"
min = { x = 1, y = 1 }
max = { x = 1, y = 4 }

[[wire_keepouts]]
label = "Right Dupont header"
min = { x = 18, y = 1 }
max = { x = 18, y = 4 }

[[access]]
direction = "east"
label = "A/B screw terminal"
required = true
allow_board_overhang = false

[access.min]
x = 3
y = 1

[access.max]
x = 5
y = 4
