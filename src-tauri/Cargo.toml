[package]
name = "perfboard-designer-app"
description = "Desktop shell for Perfboard Designer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "perfboard_designer_app"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "perfboard-designer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
perfboard-core.workspace = true
perfboard-project.workspace = true
perfboard-session-ipc = { path = "../crates/session-ipc" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.10", features = [] }
tokio.workspace = true

[lints]
workspace = true
