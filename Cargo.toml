[workspace]
members = [
    "crates/core",
    "crates/project",
    "crates/session-ipc",
    "crates/mcp-server",
    "crates/version",
    "crates/print",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
perfboard-core = { path = "crates/core" }
perfboard-project = { path = "crates/project" }
perfboard-version = { path = "crates/version" }
perfboard-print = { path = "crates/print" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
json-patch = "4.2"
schemars = { version = "1.0", features = ["uuid1"] }
thiserror = "2.0"
notify = "8.2"
sha2 = "0.10"
tokio = { version = "1.48", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
uuid = { version = "1.11", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
