schema_version = 1
id = "dev.perfboard.nano-like"
definition_version = "1.1.0"
name = "Arduino Nano-like"
description = "Generic 30-pin Nano-compatible controller module"
allowed_rotations = ["deg0", "deg90", "deg180", "deg270"]

[body]
x = -1.5
y = -1.5
width = 18.0
height = 45.0

[[pins]]
id = "d13"
name = "D13 / SCK / LED"
x = 0
y = 0
aliases = ["SCK", "LED_BUILTIN"]
functions = ["gpio", "spi_clock"]

[[pins]]
id = "3v3"
name = "3.3V"
x = 0
y = 1
functions = ["power"]

[[pins]]
id = "aref"
name = "AREF"
x = 0
y = 2
functions = ["analog_reference"]

[[pins]]
id = "a0"
name = "A0 / D14"
x = 0
y = 3
functions = ["gpio", "analog_input"]

[[pins]]
id = "a1"
name = "A1 / D15"
x = 0
y = 4
functions = ["gpio", "analog_input"]

[[pins]]
id = "a2"
